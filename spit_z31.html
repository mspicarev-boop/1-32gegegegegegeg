<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie 31</title>
    <script type="text/javascript">
        var Pudelko = {
            dlugosc: '20 cm',
            szerokosc: '15 cm',
            wysokosc: '10 cm',
            material: 'Karton',
            Pudelko_wyswietl_spitsarev: function () {
                document.write(this.dlugosc + ' ' + this.szerokosc + ' ' + this.wysokosc + ' ' + this.material + '<br>');
            }
        };

        Pudelko.Pudelko_wyswietl_spitsarev();

        Pudelko.kolor = 'Czerwony';
        Pudelko.Pudelko_pokaz_spitsarev = function () {
            alert('Kolor pudelka: ' + this.kolor);
        };
        Pudelko.Pudelko_pokaz_spitsarev();
    </script>
</head>
<body>
    <br>
    Programowanie obiektowe.<br>
    Obiekt to: Pudelko<br>
    Pola:<br>
    dlugosc<br>
    szerokosc<br>
    wysokosc<br>
    material<br>
    metoda: Pudelko_wyswietl_spitsarev<br>
    nowe pole to: kolor<br>
    nowa metoda to: Pudelko_pokaz_spitsarev()<br>
</body>
</html>
