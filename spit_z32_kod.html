<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie 32</title>
    <script type="text/javascript">

        function Pudelko(dlugosc_s, szerokosc_s, wysokosc_s, material_s){
            this.dlugosc = dlugosc_s;
            this.szerokosc = szerokosc_s;
            this.wysokosc = wysokosc_s;
            this.material = material_s;
        }

        Pudelko.prototype.Pudelko_wyswietl_spitsarev = function (){
            alert(this.dlugosc + ' | ' + this.szerokosc + ' | ' + this.wysokosc + ' | ' + this.material);
        };

        var pudelko1 = new Pudelko('20 cm', '15 cm', '10 cm', 'Karton');
        var pudelko2 = new Pudelko('30 cm', '25 cm', '20 cm', 'Plastik');
        var pudelko3 = new Pudelko('40 cm', '30 cm', '25 cm', 'Drewno');

        pudelko1.Pudelko_wyswietl_spitsarev();
        pudelko2.Pudelko_wyswietl_spitsarev();
        pudelko3.Pudelko_wyswietl_spitsarev();

        document.write("<b>Dostep do wlasciwosci:</b><br>");
        document.write("Pudelko pierwsze: " + pudelko1.dlugosc + " " + pudelko1.szerokosc + " " + pudelko1.wysokosc + " " + pudelko1.material + "<br>");
        document.write("Pudelko drugie: " + pudelko2.dlugosc + " " + pudelko2.szerokosc + " " + pudelko2.wysokosc + " " + pudelko2.material + "<br>");
        document.write("Pudelko trzecie: " + pudelko3.dlugosc + " " + pudelko3.szerokosc + " " + pudelko3.wysokosc + " " + pudelko3.material + "<br>");

        pudelko1.kolor = 'Czerwony';
        pudelko1.Pudelko_pokaz_spitsarev = function () {
            document.write("<br>Nowe pole dla pudelka pierwszego (kolor): " + this.kolor);
        };
        pudelko1.Pudelko_pokaz_spitsarev();

    </script>
</head>
