<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 30</title>
    <script type="text/javascript">
        var Pudelko = {
            kolor: 'czerwony',
            szerokosc: '20 cm',
            wysokosc: '10 cm',
            Pudelko_wyswietl_nazwisko: function () {
                document.write(this.kolor + ' ' + this.szerokosc + ' ' + this.wysokosc + '<br>');
            }
        };
        Pudelko.Pudelko_wyswietl_nazwisko();
    </script>
</head>
<body>
    <br>
    Programowanie obiektowe.<br>
    Obiekt to: Pudełko<br>
    Pola:<br>
    kolor<br>
    szerokosc<br>
    wysokosc<br>
    metoda: Pudelko_wyswietl_nazwisko<br>
</body>
</html>
